<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>404 – Ten kawałek już zjedzony · SLICE</title>

<link rel="stylesheet" href="css/fonts.css" />
<style>
  :root{ --red:#e11015; --red-deep:#7a0d10; --cream:#f1e5cf; --yellow:#f7c63b; --ink:#23150f; --white:#fff7ea; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh; display:grid; place-items:center; text-align:center;
    background:var(--red); color:var(--cream); font-family:'Fredoka', system-ui, sans-serif; padding:2rem 1rem;
  }
  .wrap{ max-width:560px; }
  svg{ width:min(46vw,210px); height:auto; filter:drop-shadow(0 16px 22px rgba(0,0,0,.3)); }
  h1{
    font-family:'Paytone One', system-ui, sans-serif; text-transform:uppercase; line-height:.95;
    font-size:clamp(3rem,14vw,6rem); color:var(--cream); margin:.4em 0 .2em;
    -webkit-text-stroke:6px #fff; paint-order:stroke fill;
  }
  p{ font-size:1.05rem; font-weight:500; margin:0 0 1.6rem; }
  a.btn{
    display:inline-flex; align-items:center; min-height:44px; padding:.8em 2em; border-radius:999px;
    background:var(--yellow); color:var(--ink); text-decoration:none; letter-spacing:.04em;
    font-family:'Luckiest Guy', system-ui, sans-serif; box-shadow:0 7px 0 var(--red-deep);
    transition:transform .25s cubic-bezier(.16,1,.3,1);
  }
  a.btn:hover{ transform:translateY(-3px) rotate(-2deg); }
  @media (prefers-reduced-motion:reduce){ a.btn{ transition:none; } }
</style>
</head>
<body>
  <main class="wrap">
    <svg viewBox="0 0 220 220" aria-hidden="true">
      <circle cx="110" cy="110" r="100" fill="#e3b35f" stroke="#a9762a" stroke-width="6"/>
      <circle cx="110" cy="110" r="80" fill="#f3c44e"/>
      <path d="M110 110 L40 38 A100 100 0 0 1 180 38 Z" fill="var(--red)" opacity=".18"/>
      <circle cx="92" cy="104" r="15" fill="#fff" stroke="#23150f" stroke-width="3"/>
      <circle cx="94" cy="108" r="6" fill="#23150f"/>
      <circle cx="130" cy="104" r="15" fill="#fff" stroke="#23150f" stroke-width="3"/>
      <circle cx="132" cy="108" r="6" fill="#23150f"/>
      <path d="M94 138 q18 -12 36 0" fill="none" stroke="#23150f" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>404</h1>
    <p>Ups! Ten kawałek ktoś już zjadł. Strona, której szukasz, nie istnieje.</p>
    <a class="btn" href="./">Wróć do SLICE</a>
  </main>
</body>
</html>
